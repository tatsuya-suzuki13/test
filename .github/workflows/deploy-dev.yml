name: Deploy Dev

on:
  push:
    branches:
      - main

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    environment: development

    steps:

      - uses: actions/checkout@v4

      - name: Build
        run: |
          docker build -t app:${GITHUB_SHA} .

      - name: Push ECR
        run: |
          docker push xxxx.dkr.ecr.ap-northeast-1.amazonaws.com/app:${GITHUB_SHA}

      - name: Deploy Dev
        run: |
          aws deploy create-deployment ...
