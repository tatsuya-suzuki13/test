name: Deploy Dev

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: development

    steps:
      - name: Show Environment
        run: |
          echo "Deploying to Development"
          echo "Environment = development"

      - name: Show Variables
        run: |
          echo "Git SHA: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"
